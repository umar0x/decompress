name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use the npm version the lockfile was generated with
        run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:nobuild

  lockfile-sync:
    name: Lockfile in sync with manifests
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Use the npm version the lockfile was generated with
        run: npm install -g npm@11.19.0
      - name: Verify package-lock.json matches package.json
        run: |
          cp package-lock.json /tmp/lock-before.json
          npm install --package-lock-only --ignore-scripts
          if ! diff -u /tmp/lock-before.json package-lock.json; then
            echo "::error::package-lock.json is out of sync with the manifests."
            echo "::error::Regenerate it locally with: npm install --package-lock-only"
            echo "::error::then commit the updated lockfile with your change."
            exit 1
          fi

  release-readiness:
    name: Release readiness
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Use the npm version the lockfile was generated with
        run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run verify:release
      - run: npm run build
      - run: npm run coverage
      - run: npm run test:pack:nobuild
      - run: npm audit --audit-level=low
      - run: npm audit signatures
      - name: Assert POSIX symlink capability
        run: node -e "require('node:fs').symlinkSync('package.json','/tmp/_sym_check');console.log('symlinks OK');require('node:fs').unlinkSync('/tmp/_sym_check')"

  plugin-contract:
    name: Plugin record contract regression
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Use the npm version the lockfile was generated with
        run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run build
      - name: Run plugin contract regression suite
        run: node --import tsx --test --test-reporter=spec packages/core/test/security/plugin-contract.test.ts
