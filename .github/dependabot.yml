version: 2
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: daily
      time: '06:00'
      timezone: Asia/Kolkata
    commit-message:
      prefix: deps
    # typescript 6+ is not supported by the pinned typescript-eslint range
    # (<6.1.0); bumps beyond 5.9.x are taken deliberately with tooling updates.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: daily
      time: '06:00'
      timezone: Asia/Kolkata
    commit-message:
      prefix: ci
