version: 2
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: daily
      time: '06:00'
      timezone: Asia/Kolkata
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: daily
      time: '06:00'
      timezone: Asia/Kolkata
    commit-message:
      prefix: ci
